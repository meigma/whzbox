# Exercise the binary release matrix on every pull request without publishing
# release assets or updating the Homebrew tap and Scoop bucket. Snapshot mode is
# required because verifiable module-proxy builds can resolve only pushed tags.

name: Release Dry Run

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binary-release-dry-run:
    name: Binary Release Dry Run
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Create synthetic release tag
        env:
          DRY_RUN_TAG: v0.0.0-dryrun.${{ github.run_id }}.${{ github.run_attempt }}
        run: git tag -f "$DRY_RUN_TAG"

      - name: Run GoReleaser without publishing
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: v2.14.3
          args: release --snapshot --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: v0.0.0-dryrun.${{ github.run_id }}.${{ github.run_attempt }}

      - name: Validate release artifacts and ghd contract
        shell: bash
        run: |
          set -euo pipefail

          version="v0.0.0-dryrun.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}-dev"
          expected_signer="${GITHUB_REPOSITORY}/.github/workflows/attest.yml"
          actual_signer="$(awk -F'"' '/signer_workflow/ { print $2; exit }' ghd.toml)"

          if [ "$actual_signer" != "$expected_signer" ]; then
            echo "ghd.toml signer_workflow must be $expected_signer, got $actual_signer" >&2
            exit 1
          fi

          jq -e --arg prefix "whzbox_${version}_" '
            [.[] | select(.type == "Archive" and (.name | startswith($prefix)))] | length == 5
          ' dist/artifacts.json >/dev/null
          jq -e --arg prefix "whzbox_${version}_" '
            [.[] | select(.type == "SBOM" and (.name | startswith($prefix)))] | length == 5
          ' dist/artifacts.json >/dev/null
          jq -e '[.[] | select(.type == "Checksum" and .name == "checksums.txt")] | length == 1' \
            dist/artifacts.json >/dev/null

          for os in darwin linux; do
            for arch in amd64 arm64; do
              archive="whzbox_${version}_${os}_${arch}.tar.gz"
              pattern="pattern = \"whzbox_\${version}_${os}_${arch}.tar.gz\""

              test -f "dist/$archive"
              test -f "dist/$archive.sbom.json"
              grep -Fq "$pattern" ghd.toml
              awk -v name="$archive" '$2 == name && length($1) == 64 && $1 ~ /^[[:xdigit:]]+$/ { found = 1 } END { exit(found ? 0 : 1) }' dist/checksums.txt
            done
          done

          test -f "dist/whzbox_${version}_windows_amd64.zip"
          test -f "dist/whzbox_${version}_windows_amd64.zip.sbom.json"

      - name: Smoke test stamped binary
        shell: bash
        run: |
          set -euo pipefail

          version="v0.0.0-dryrun.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}-dev"
          host_os="$(go env GOHOSTOS)"
          host_arch="$(go env GOHOSTARCH)"
          bin="$(jq -r --arg os "$host_os" --arg arch "$host_arch" '.[] | select(.type == "Binary" and .goos == $os and .goarch == $arch) | .path' dist/artifacts.json)"

          if [ -z "$bin" ] || [ "$bin" = "null" ] || [ ! -x "$bin" ]; then
            echo "failed to locate executable host binary" >&2
            jq . dist/artifacts.json >&2
            exit 1
          fi

          version_output="$("$bin" version)"
          flag_output="$("$bin" --version)"
          printf '%s\n' "$version_output" "$flag_output"

          [[ "$version_output" == *"$version"* ]]
          [[ "$flag_output" == *"$version"* ]]
