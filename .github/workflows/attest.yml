# Reusable workflow that generates binary provenance outside the build job. The
# OIDC identity used for attestation is minted here and is unavailable to the
# release's build and publishing steps.

name: Attest (reusable)

on:
  workflow_call:
    inputs:
      checksums-artifact:
        description: Name of the uploaded artifact containing checksums.txt.
        type: string
        required: true

permissions: {}

jobs:
  attest:
    name: Attest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.checksums-artifact }}

      - name: Attest binary checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: checksums.txt
