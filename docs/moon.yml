# https://moonrepo.dev/docs/config/project
$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'
stack: 'frontend'

toolchains:
  default: 'system'

tasks:
  install:
    command: 'npm ci'
    inputs:
      - 'package.json'
      - 'package-lock.json'
    outputs:
      - 'node_modules/.package-lock.json'
    options:
      cache: false

  build:
    command: 'npm run build'
    deps:
      - 'docs:install'
    inputs:
      - 'index.md'
      - 'tutorials/**/*'
      - 'how-to/**/*'
      - 'reference/**/*'
      - 'explanation/**/*'
      - 'src/**/*'
      - 'static/**/*'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'docusaurus.config.ts'
      - 'sidebars.ts'
    outputs:
      - 'build'
    options:
      cache: true

  typecheck:
    command: 'npm run typecheck'
    deps:
      - 'docs:install'
    inputs:
      - 'src/**/*'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'docusaurus.config.ts'
      - 'sidebars.ts'
    options:
      cache: true
