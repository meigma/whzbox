# https://moonrepo.dev/docs/config/project
$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'go'
layer: 'application'
stack: 'backend'

project:
  title: 'whzbox'
  description: 'Provision and manage Whizlabs sandboxes from the command line.'
  owner: 'meigma'
  maintainers:
    - 'meigma'

toolchains:
  default: 'system'

fileGroups:
  goSources:
    - 'cmd/**/*.go'
    - 'internal/**/*.go'
    - 'go.mod'
    - 'go.sum'
    - 'mise.toml'
    - 'mise.lock'
  lintConfig:
    - '.golangci.yml'
    - 'mise.toml'
    - 'mise.lock'
  releaseConfig:
    - '.goreleaser.yaml'
    - 'ghd.toml'
    - 'release-please-config.json'
    - '.release-please-manifest.json'
    - '.github/workflows/*.yml'
  repositorySettings:
    - '.github/repository-settings.toml'
    - '.github/dependabot.yml'
    - '.github/scripts/configure_github_repo.py'
    - '.github/scripts/test_configure_github_repo.py'

workspace:
  inheritedTasks:
    include: []

tasks:
  format:
    command: 'golangci-lint fmt --config .golangci.yml --diff'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
    options:
      cache: false

  build:
    command: 'go build ./...'
    inputs:
      - '@group(goSources)'
    options:
      cache: true

  test:
    command: 'go test ./... -race -shuffle on -count 1'
    inputs:
      - '@group(goSources)'
    options:
      cache: false

  vet:
    command: 'go vet ./...'
    inputs:
      - '@group(goSources)'
    options:
      cache: true

  lint:
    command: 'golangci-lint run --config .golangci.yml ./... --show-stats=false'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
    options:
      cache: false

  repositorySettingsTest:
    command: 'python .github/scripts/test_configure_github_repo.py'
    inputs:
      - '@group(repositorySettings)'
      - 'mise.toml'
      - 'mise.lock'
    options:
      cache: false

  check:
    deps:
      - 'root:format'
      - 'root:lint'
      - 'root:build'
      - 'root:test'
      - 'root:vet'
      - 'root:repositorySettingsTest'
      - 'docs:build'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
      - '@group(releaseConfig)'
    options:
      cache: false
      runInCI: true
